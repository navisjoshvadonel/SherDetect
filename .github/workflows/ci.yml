name: SherDetect CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-backend-and-ai:
    name: Backend & AI Engine Verification
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f ai_engine/requirements.txt ]; then pip install -r ai_engine/requirements.txt; fi
          pip install pytest pytest-asyncio httpx starlette fastapi flake8 bandit

      - name: Run SAST Security Scan (Bandit)
        run: |
          bandit -r backend/app ai_engine -ll -ii --exclude ai_engine/tests,backend/tests || true

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend ai_engine --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend ai_engine --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run AI & Backend Forensic Unit Tests & E2E Integration Suite
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest ai_engine/tests/ backend/tests/ -v

  validate-frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check package.json existence
        id: check_pkg
        run: |
          if [ -f frontend/package.json ]; then
            echo "has_pkg=true" >> $GITHUB_OUTPUT
          else
            echo "has_pkg=false" >> $GITHUB_OUTPUT
            echo "No frontend package.json found yet, skipping build."
          fi

      - name: Set up Node.js 20
        if: steps.check_pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: steps.check_pkg.outputs.has_pkg == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Linter
        if: steps.check_pkg.outputs.has_pkg == 'true'
        working-directory: ./frontend
        run: npm run lint

      - name: Run Next.js Build
        if: steps.check_pkg.outputs.has_pkg == 'true'
        working-directory: ./frontend
        run: npm run build
