name: SherDetect CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-backend-and-ai:
    name: Backend & AI Engine Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f ai_engine/requirements.txt ]; then pip install -r ai_engine/requirements.txt; fi
          pip install pytest pytest-asyncio httpx starlette fastapi

      - name: Run AI & Backend Forensic Unit Tests
        run: |
          python -m pytest ai_engine/tests/ backend/tests/ -v

  validate-frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check package.json existence
        id: check_pkg
        run: |
          if [ -f frontend/package.json ]; then
            echo "has_pkg=true" >> $GITHUB_OUTPUT
          else
            echo "has_pkg=false" >> $GITHUB_OUTPUT
            echo "No frontend package.json found yet, skipping build."
          fi

      - name: Set up Node.js 20
        if: steps.check_pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        if: steps.check_pkg.outputs.has_pkg == 'true'
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Next.js Build
        if: steps.check_pkg.outputs.has_pkg == 'true'
        working-directory: ./frontend
        run: npm run build
