version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_engine:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8003:8001"
    environment:
      - AI_ENGINE_URL=http://ai_engine:8000/api/verify-document
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost:3002,http://frontend:3000
    depends_on:
      ai_engine:
        condition: service_started
      redis:
        condition: service_healthy

  backend_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.app.celery_app", "worker", "--loglevel=info"]
    environment:
      - AI_ENGINE_URL=http://ai_engine:8000/api/verify-document
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      ai_engine:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=http://localhost:8003
    depends_on:
      - backend_api
